<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b12"/>
<title>CineNova — Stream Beyond</title>
<meta name="description" content="Watch free HD movies and web series on CineNova."/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0b12;--text:#f5f5f7;--muted:#9ca3af;--rose:#e11d48}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 480px at 0% 0%,rgba(236,72,153,.22),transparent 55%),
    radial-gradient(700px 400px at 100% 0%,rgba(139,92,246,.18),transparent 50%),
    #0b0b12;
  padding-bottom:100px;
}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
img{display:block;max-width:100%}

#nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 8px;position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(11,11,18,.95) 60%,transparent);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:42px;height:42px;flex-shrink:0}
.brand-mark svg{width:42px;height:42px;display:block}
.brand-txt{display:flex;flex-direction:column;line-height:1.05}
.brand-txt .name{
  font-size:1.35rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(90deg,#ff6b8a 0%,#c084fc 45%,#67e8f9 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand-txt .tag{font-size:.52rem;font-weight:700;letter-spacing:.2em;color:#a78bfa;text-transform:uppercase;margin-top:2px}
.nav-right{display:flex;gap:10px}
.nav-ico{
  width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,.06);color:#fff;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
}
.nav-ico .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#ef4444;border:1.5px solid #0b0b12}

#filters{display:flex;gap:10px;overflow-x:auto;padding:6px 18px 14px;scrollbar-width:none}
#filters::-webkit-scrollbar{display:none}
.fchip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:10px 16px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:#d1d5db;font-size:.82rem;font-weight:600;white-space:nowrap;
}
.fchip.active{background:#f3f4f6;color:#111;border-color:transparent;box-shadow:0 4px 16px rgba(0,0,0,.25)}

.sec{padding:4px 0 8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px}
.sec-head h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.sec-head .more{font-size:.85rem;color:#9ca3af;font-weight:600}

#trend{display:flex;gap:14px;overflow-x:auto;padding:0 18px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
#trend::-webkit-scrollbar{display:none}
.tc{flex:0 0 148px;scroll-snap-align:start;cursor:pointer}
.tc-poster{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2/3;background:#1a1a24;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.tc-poster img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;border:none;background:#e11d48;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(225,29,72,.5);cursor:pointer}
.tc-info{padding:8px 2px 0}
.tc-title{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-meta{font-size:.68rem;color:#9ca3af;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-star{font-size:.72rem;color:#fbbf24;font-weight:700;margin-top:3px}

.disc-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 12px;gap:10px;flex-wrap:wrap}
.disc-head h2{font-size:1.3rem;font-weight:800}
.genre-pills{display:flex;gap:6px;flex-wrap:wrap}
.gpill{padding:6px 12px;border-radius:999px;border:none;cursor:pointer;background:rgba(255,255,255,.06);color:#d1d5db;font-size:.75rem;font-weight:600}
.gpill.active{background:#f3f4f6;color:#111}

#discover{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 20px}
.dc{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;background:#1a1a24;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.dc img{width:100%;height:100%;object-fit:cover}
.dc-fade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.15) 55%,transparent 100%)}
.dc .play{right:12px;bottom:40px}
.dc-info{position:absolute;left:12px;right:48px;bottom:10px}
.dc-title{font-size:.9rem;font-weight:800;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.dc-meta{font-size:.68rem;color:#d1d5db;margin-top:3px}
.dc-star{font-size:.72rem;color:#fbbf24;font-weight:700;margin-top:2px}

#pager{display:flex;gap:8px;justify-content:center;padding:4px 18px 20px;flex-wrap:wrap}
#pager button{min-width:38px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-weight:700;cursor:pointer}
#pager button.on{background:#e11d48;border-color:transparent}
.msg{text-align:center;padding:40px 16px;color:#9ca3af}

#bnav{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:80;
  display:flex;justify-content:space-around;align-items:center;padding:10px 8px;
  background:rgba(22,22,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.45);
}
.bi{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:#6b7280;font-size:.62rem;font-weight:600;padding:4px}
.bi svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.bi.active{color:#e11d48}
.bi.active svg{stroke:#e11d48}

#search{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);padding:18px}
#search.open{display:block}
.sbar{display:flex;align-items:center;gap:10px;background:#16161f;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.sbar input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:1rem}
#sres{max-height:75vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.si{display:flex;gap:12px;align-items:center;background:#16161f;border-radius:12px;padding:8px;cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.si img{width:46px;height:68px;object-fit:cover;border-radius:8px;background:#222}

#modal{display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);overflow-y:auto;padding:16px 12px 110px}
#modal.open{display:block}
.msheet{max-width:480px;margin:0 auto;background:#12121a;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.mhero{position:relative;aspect-ratio:16/10;background:#111}
.mhero img{width:100%;height:100%;object-fit:cover}
.mx{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:1rem;cursor:pointer}
.mbody{padding:16px}
.mbody h1{font-size:1.3rem;font-weight:800;margin-bottom:8px}
.mbadges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mb{font-size:.7rem;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:#e5e7eb}
.mdesc{font-size:.88rem;color:#d1d5db;line-height:1.55;margin-bottom:14px}
.mbtn{width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#e11d48,#a855f7);color:#fff;font-weight:800;font-size:.95rem;margin-bottom:8px}
.mbtn2{width:100%;padding:12px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-weight:700;margin-bottom:8px;display:block;text-align:center}
.mdl{display:flex;flex-wrap:wrap;gap:8px}
.mdl a{flex:1;min-width:80px;text-align:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:.8rem;font-weight:700}
</style>
</head>
<body>

<header id="nav">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4d6d"/>
            <stop offset="40%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <path fill="url(#gC)" d="M34.5 10.2C30.8 7.1 26.2 5.5 21.2 5.5 11.2 5.5 3.5 13.2 3.5 23.5S11.2 41.5 21.2 41.5c5 0 9.6-1.6 13.3-4.7l-3.4-4.6c-2.5 2.1-5.9 3.3-9.9 3.3-7.1 0-12.5-5.3-12.5-12S14.1 11.5 21.2 11.5c4 0 7.4 1.2 9.9 3.3l3.4-4.6z"/>

<!-- Firebase via REST only (no SDK) -->
<script>
(function(){
  var DB = "https://cinenova-8987c-default-rtdb.firebaseio.com";
  var all = [];
  var mode = "trending";
  var genre = "all";
  var page = 1;
  var PAGE = 12;
  var mylist = [];
  try { mylist = JSON.parse(localStorage.getItem("cn_list") || "[]") || []; } catch (e) {}

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function pic(m) { return (m && (m.thumbnail || m.poster)) || ""; }
  function saveList() { try { localStorage.setItem("cn_list", JSON.stringify(mylist)); } catch (e) {} }

  function setMsg(where, text) {
    var el = document.getElementById(where);
    if (el) el.innerHTML = '<div class="msg">' + text + "</div>";
  }

  function parseMovies(data) {
    var arr = [];
    if (!data || typeof data !== "object") return arr;
    Object.keys(data).forEach(function (k) {
      if (k === "null" || data[k] === null) return;
      var m = data[k] || {};
      if (typeof m !== "object") return;
      m._key = k;
      arr.push(m);
    });
    arr.sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
    return arr;
  }

  function fetchJSON(url, ms) {
    ms = ms || 15000;
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () {
        if (done) return;
        done = true;
        reject(new Error("timeout"));
      }, ms);
      fetch(url, { mode: "cors", cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (j) {
          if (done) return;
          done = true;
          clearTimeout(t);
          resolve(j);
        })
        .catch(function (e) {
          if (done) return;
          done = true;
          clearTimeout(t);
          reject(e);
        });
    });
  }

  function trendList() {
    var t = all.filter(function (m) { return m.trending === true || m.trending === "true"; });
    if (t.length < 6) t = all.slice(0, 18);
    return t.slice(0, 20);
  }

  function discoverList() {
    var src = all.slice();
    if (mode === "top") src.sort(function (a, b) { return (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0); });
    else if (mode === "new") src.sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
    if (genre !== "all") {
      var g = genre.toLowerCase();
      src = src.filter(function (m) {
        return String(m.genre || "").toLowerCase().indexOf(g) !== -1 ||
               String(m.category || "").toLowerCase().indexOf(g) !== -1;
      });
    }
    return src;
  }

  function renderTrend() {
    var el = document.getElementById("trend");
    var items = trendList();
    if (!items.length) { el.innerHTML = '<div class="msg">No trending</div>'; return; }
    el.innerHTML = items.map(function (m) {
      var src = pic(m);
      var meta = [m.year, m.genre ? String(m.genre).split(",")[0] : "", m.quality].filter(Boolean).join(" · ");
      return '<div class="tc" data-k="' + esc(m._key) + '"><div class="tc-poster">' +
        (src ? '<img loading="lazy" src="' + esc(src) + '" alt=""/>' : "") +
        '<button class="play" type="button">▶</button></div><div class="tc-info"><div class="tc-title">' + esc(m.title || "") + "</div>" +
        (meta ? '<div class="tc-meta">' + esc(meta) + "</div>" : "") +
        (m.rating ? '<div class="tc-star">★ ' + esc(m.rating) + "</div>" : "") +
        "</div></div>";
    }).join("");
    el.querySelectorAll(".tc").forEach(function (n) {
      n.onclick = function () { openMovie(n.getAttribute("data-k")); };
    });
  }

  function renderDiscover() {
    var el = document.getElementById("discover");
    var pager = document.getElementById("pager");
    var src = discoverList();
    if (!src.length) { el.innerHTML = '<div class="msg">No movies</div>'; pager.innerHTML = ""; return; }
    var pages = Math.max(1, Math.ceil(src.length / PAGE));
    if (page > pages) page = pages;
    var slice = src.slice((page - 1) * PAGE, page * PAGE);
    el.innerHTML = slice.map(function (m) {
      var srcImg = pic(m);
      var meta = [m.year, m.genre ? String(m.genre).split(",")[0] : "", m.quality].filter(Boolean).join(" · ");
      return '<div class="dc" data-k="' + esc(m._key) + '">' +
        (srcImg ? '<img loading="lazy" src="' + esc(srcImg) + '" alt=""/>' : "") +
        '<div class="dc-fade"></div><button class="play" type="button">▶</button>' +
        '<div class="dc-info"><div class="dc-title">' + esc(m.title || "") + "</div>" +
        (meta ? '<div class="dc-meta">' + esc(meta) + "</div>" : "") +
        (m.rating ? '<div class="dc-star">★ ' + esc(m.rating) + "</div>" : "") +
        "</div></div>";
    }).join("");
    el.querySelectorAll(".dc").forEach(function (n) {
      n.onclick = function () { openMovie(n.getAttribute("data-k")); };
    });
    if (pages <= 1) { pager.innerHTML = ""; return; }
    var h = "";
    if (page > 1) h += '<button data-p="' + (page - 1) + '">‹</button>';
    for (var i = 1; i <= Math.min(pages, 6); i++) h += '<button class="' + (i === page ? "on" : "") + '" data-p="' + i + '">' + i + "</button>";
    if (page < pages) h += '<button data-p="' + (page + 1) + '">›</button>';
    pager.innerHTML = h;
    pager.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () { page = parseInt(b.getAttribute("data-p"), 10) || 1; renderDiscover(); };
    });
  }

  function render() {
    renderTrend();
    renderDiscover();
  }

  function load() {
    setMsg("trend", "Loading…");
    setMsg("discover", "Loading…");

    var urls = [
      DB + '/movies.json?orderBy="addedAt"&limitToLast=100',
      DB + '/movies.json?orderBy="$key"&limitToLast=80',
      DB + "/movies.json?shallow=true"
    ];

    function tryUrl(i) {
      if (i >= urls.length) {
        setMsg("trend", "Failed");
        setMsg("discover", "Could not load movies. Check internet / host on https domain.");
        return;
      }
      var u = urls[i];
      fetchJSON(u, 12000).then(function (data) {
        // shallow returns {id:true}
        var firstKey = data && Object.keys(data)[0];
        if (firstKey && data[firstKey] === true) {
          // shallow — fetch one batch of full objects by key is heavy; try next
          tryUrl(i + 1);
          return;
        }
        all = parseMovies(data);
        if (!all.length) {
          tryUrl(i + 1);
          return;
        }
        render();
        // background more
        fetchJSON(DB + '/movies.json?orderBy="addedAt"&limitToLast=300', 20000).then(function (data2) {
          var more = parseMovies(data2);
          var seen = {};
          all.forEach(function (m) { seen[m._key] = 1; });
          more.forEach(function (m) { if (!seen[m._key]) all.push(m); });
          all.sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
          render();
        }).catch(function () {});
      }).catch(function () {
        tryUrl(i + 1);
      });
    }
    tryUrl(0);
  }

  document.querySelectorAll("#filters .fchip").forEach(function (c) {
    c.onclick = function () {
      document.querySelectorAll("#filters .fchip").forEach(function (x) { x.classList.remove("active"); });
      c.classList.add("active");
      mode = c.getAttribute("data-mode") || "trending";
      page = 1;
      if (mode === "genres") document.getElementById("genrePills").scrollIntoView({ behavior: "smooth", block: "center" });
      renderDiscover();
    };
  });
  document.querySelectorAll("#genrePills .gpill").forEach(function (c) {
    c.onclick = function () {
      document.querySelectorAll("#genrePills .gpill").forEach(function (x) { x.classList.remove("active"); });
      c.classList.add("active");
      genre = c.getAttribute("data-g") || "all";
      page = 1;
      renderDiscover();
    };
  });

  function openMovie(key) {
    var m = all.find(function (x) { return x._key === key; });
    if (!m) return;
    var src = pic(m);
    var badges = "";
    [m.year, m.rating ? ("★ " + m.rating) : "", m.category, m.genre ? String(m.genre).split(",")[0] : "", m.language, m.quality].filter(Boolean).forEach(function (b) {
      badges += '<span class="mb">' + esc(b) + "</span>";
    });
    var dls = "";
    [["480p", m.download480p], ["720p", m.download720p], ["1080p", m.download1080p], ["4K", m.download4k]].forEach(function (p) {
      if (p[1]) dls += '<a href="' + esc(p[1]) + '" target="_blank" rel="noopener">' + p[0] + "</a>";
    });
    var play = "https://play.cinenova.site/watch?id=" + encodeURIComponent(key);
    var dl = "https://download.cinenova.site/get?id=" + encodeURIComponent(key);
    var inL = mylist.indexOf(key) !== -1;
    document.getElementById("msheet").innerHTML =
      '<div class="mhero">' + (src ? '<img src="' + esc(src) + '" alt=""/>' : "") + '<button class="mx" id="mx">✕</button></div>' +
      '<div class="mbody"><h1>' + esc(m.title || "") + '</h1><div class="mbadges">' + badges + "</div>" +
      (m.description ? '<div class="mdesc">' + esc(String(m.description).slice(0, 480)) + "</div>" : "") +
      '<button class="mbtn" id="mw">▶ Watch Now</button>' +
      '<button class="mbtn2" id="ml">' + (inL ? "✓ In My List" : "🔖 Add to My List") + "</button>" +
      (dls ? '<div class="mdl">' + dls + "</div>" : "") +
      '<a class="mbtn2" href="' + esc(dl) + '" target="_blank">⬇ Download</a></div>';
    document.getElementById("modal").classList.add("open");
    document.getElementById("mx").onclick = function () { document.getElementById("modal").classList.remove("open"); };
    document.getElementById("mw").onclick = function () { window.open(play, "_blank"); };
    document.getElementById("ml").onclick = function () {
      var i = mylist.indexOf(key);
      if (i === -1) mylist.push(key); else mylist.splice(i, 1);
      saveList();
      openMovie(key);
    };
  }
  document.getElementById("modal").onclick = function (e) {
    if (e.target.id === "modal") document.getElementById("modal").classList.remove("open");
  };

  document.getElementById("btnSearch").onclick = function () {
    document.getElementById("search").classList.add("open");
    document.getElementById("searchInp").focus();
  };
  document.getElementById("searchX").onclick = function () {
    document.getElementById("search").classList.remove("open");
  };
  document.getElementById("searchInp").oninput = function () {
    var q = (this.value || "").toLowerCase().trim();
    var box = document.getElementById("sres");
    if (!q) { box.innerHTML = ""; return; }
    var hits = all.filter(function (m) { return (m.title || "").toLowerCase().indexOf(q) !== -1; }).slice(0, 25);
    box.innerHTML = hits.map(function (m) {
      var s = pic(m);
      return '<div class="si" data-k="' + esc(m._key) + '">' +
        (s ? '<img src="' + esc(s) + '"/>' : '<div style="width:46px;height:68px;background:#222;border-radius:8px"></div>') +
        '<div><div style="font-weight:700">' + esc(m.title || "") + '</div><div style="font-size:.75rem;color:#9ca3af">' +
        esc([m.year, m.category].filter(Boolean).join(" · ")) + "</div></div></div>";
    }).join("") || '<div class="msg">No results</div>';
    box.querySelectorAll(".si").forEach(function (n) {
      n.onclick = function () {
        document.getElementById("search").classList.remove("open");
        openMovie(n.getAttribute("data-k"));
      };
    });
  };

  document.querySelectorAll("#bnav .bi").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll("#bnav .bi").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      var g = b.getAttribute("data-go");
      if (g === "home") {
        mode = "trending"; genre = "all"; page = 1;
        document.querySelector(".disc-head h2").textContent = "Discover Movies";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      if (g === "explore") {
        document.getElementById("search").classList.add("open");
        document.getElementById("searchInp").focus();
      }
      if (g === "list") {
        document.querySelector(".disc-head h2").textContent = "My List";
        var el = document.getElementById("discover");
        var mine = all.filter(function (m) { return mylist.indexOf(m._key) !== -1; });
        el.innerHTML = mine.length ? mine.slice(0, 24).map(function (m) {
          var s = pic(m);
          return '<div class="dc" data-k="' + esc(m._key) + '">' + (s ? '<img src="' + esc(s) + '"/>' : "") +
            '<div class="dc-fade"></div><button class="play">▶</button><div class="dc-info"><div class="dc-title">' + esc(m.title || "") + "</div></div></div>";
        }).join("") : '<div class="msg">My List empty</div>';
        el.querySelectorAll(".dc").forEach(function (n) {
          n.onclick = function () { openMovie(n.getAttribute("data-k")); };
        });
        document.getElementById("pager").innerHTML = "";
      }
      if (g === "profile") alert("Profile soon");
    };
  });

  var va = document.getElementById("viewAll");
  if (va) va.onclick = function (e) { e.preventDefault(); mode = "new"; page = 1; renderDiscover(); };

  load();
})();
</script>
</script>
</body>
</html>
